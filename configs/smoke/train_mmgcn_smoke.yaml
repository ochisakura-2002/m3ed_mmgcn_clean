project:
  name: m3ed_mmgcn_clean
  experiment_name: mmgcn_smoke_fake_dialogues

system:
  seed: 7
  device: cpu
  output_dir: tmp/smoke_outputs

dataset:
  name: MMGCN_SMOKE
  sample_unit: dialogue
  num_classes: 3
  label_list:
    - Happy
    - Neutral
    - Sad
  split_sizes:
    train: 4
    val: 2
    test: 2
  dialogue_lengths:
    - 3
    - 4
  seed: 1234

model:
  name: MMGCN
  text_feature_dim: 8
  audio_feature_dim: 6
  visual_feature_dim: 4
  hidden_dim: 8
  dropout: 0.1

train:
  batch_size: 2
  learning_rate: 1e-3
  weight_decay: 0.0
  max_epochs: 1
  num_workers: 0

logging:
  save_best: true
  save_last: true
  monitor_metric: val_uar

graph:
  context_mode: full
  window_past: null
  window_future: null
  num_layers: 1
  lamda: 0.5
  alpha: 0.1
  gamma: 0.7
  use_speaker: true
  use_modal: true
  use_residual: true

modality:
  active_modalities:
    - text
    - audio
    - visual

notes:
  purpose: >
    Smoke config for restoring the MMGCN experiment loop without reading real
    M3ED data. Runtime artifacts are written under tmp/smoke_outputs.
