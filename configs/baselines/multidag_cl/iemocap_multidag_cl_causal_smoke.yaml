project:
  name: m3ed_mmgcn_clean
  experiment_name: iemocap_multidag_cl_causal_smoke

system:
  seed: 42
  device: cuda
  output_dir: outputs

dataset:
  name: IEMOCAP
  feature_pkl_path: third_party/MMGCN_official/IEMOCAP_features/IEMOCAP_features.pkl
  num_classes: 6
  label_list:
    - Happy
    - Sad
    - Neutral
    - Angry
    - Excited
    - Frustrated
  valid_ratio: 0.1
  val_split_strategy: official_prefix
  sample_unit: dialogue

model:
  name: MultiDAGCL
  text_feature_dim: 100
  audio_feature_dim: 1582
  visual_feature_dim: 342
  hidden_dim: 128
  num_classes: 6
  num_speakers: 2
  dropout: 0.3
  active_modalities: ["text", "audio", "visual"]
  num_graph_layers: 2
  modality_encoder_type: causal_gru
  modality_encoder_layers: 1

graph:
  context_mode: causal
  window_past: 5

training:
  epochs: 1
  batch_size: 2
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  select_best_by: val_weighted_f1
  max_train_batches: 2
  max_val_batches: 2
  num_workers: 0

output:
  run_root: outputs/runs
  experiment_name: iemocap_multidag_cl_causal_smoke
