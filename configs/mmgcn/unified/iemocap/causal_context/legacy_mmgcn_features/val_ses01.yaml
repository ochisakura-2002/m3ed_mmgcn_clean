causal: true
causal_contract_version: '1.0'

project:
  name: m3ed_mmgcn_clean
  experiment_name: mmgcn_iemocap_causal_benchmark_val_ses01

system:
  seed: 42
  device: cuda
  output_dir: outputs

dataset:
  name: IEMOCAP
  feature_pkl_path: third_party/MMGCN_official/IEMOCAP_features/IEMOCAP_features.pkl
  feature_sha256: ceb5cc9a45d1792998438e27f86a12642320aa6315546e4425316140ea503fb3
  num_classes: 6
  label_list: [Happy, Sad, Neutral, Angry, Excited, Frustrated]
  valid_ratio: 0.1
  val_split_strategy: session_holdout
  val_session_id: Ses01
  sample_unit: dialogue

model:
  name: MMGCN
  text_feature_dim: 100
  audio_feature_dim: 1582
  visual_feature_dim: 342
  hidden_dim: 256
  dropout: 0.5

train:
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_epochs: 30
  num_workers: 0

logging:
  save_best: true
  save_last: true
  monitor_metric: val_weighted_f1

graph:
  context_mode: causal
  window_past: null
  window_future: 0
  num_layers: 4
  lamda: 0.5
  alpha: 0.1
  gamma: 0.7
  use_speaker: true
  use_modal: true
  use_residual: false
