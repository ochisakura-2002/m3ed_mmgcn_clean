# Independent TA-only lineage. Existing paper_reimplementation is unchanged.
# Causal scope: canonical utterance order, assuming utterance-local input features.
model:
  text_dim: 768
  audio_dim: 1582
  encoder_dim: 100
  dag_hidden_dim: 300
  dag_layers: 4
  num_classes: 6
  window_past_same_speaker: 1
  classifier_dropout: 0.4
dataset:
  package: asymmetric_merc_v1
  label_vocab: [hap, sad, neu, ang, exc, fru]
  # Deliberately unresolved in this synthetic-only implementation stage.
  asset_path: null
  model_manifest_path: null
  provenance_manifest_path: null
runtime:
  mode: development
  synthetic_only: true
  device: cpu
  splits: [train, dev]
  curriculum: false
  seed: 100
checkpoint:
  selection_metric: dev_weighted_f1
  test_evaluation_count: 0
  test_split_used_for_selection: false
output:
  root: outputs
  experiment_date: null
  experiment_group: ta_v0_development
