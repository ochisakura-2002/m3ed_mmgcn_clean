causal: true
causal_contract_version: '1.0'
run_name: causal_gsmcc_synthetic_end_to_end

system:
  seed: 3101
  device: cpu

dataset:
  name: SYNTHETIC
  num_classes: 4
  label_list: [Happy, Sad, Neutral, Angry]
  text_feature_dim: 8
  audio_feature_dim: 6
  visual_feature_dim: 4

model:
  name: causal_gsmcc_inspired
  text_dim: 8
  audio_dim: 6
  visual_dim: 4
  hidden_dim: 8
  num_classes: 4
  dropout: 0.0
  modality_encoder_type: linear
  fusion_type: concat
  num_graph_layers: 1
  num_filter_steps: 2

graph:
  context_mode: causal
  window_past: 3
  window_future: 0

loss:
  classification_weight: 1.0
  consistency_weight: 0.0
  complementarity_weight: 0.0

training:
  epochs: 2
  batch_size: 2
  seed: 3101
  select_best_by: val_weighted_f1
  grad_clip: 1.0
  num_workers: 0

optimizer:
  name: AdamW
  learning_rate: 0.001
  weight_decay: 0.0

scheduler:
  name: none

synthetic:
  sequence_length: 5
  split_sizes:
    train: 6
    val: 4
    test: 4

output:
  root: outputs
  experiment_date: null
