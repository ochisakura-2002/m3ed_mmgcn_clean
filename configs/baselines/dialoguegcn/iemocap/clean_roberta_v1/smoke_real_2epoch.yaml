causal: true
causal_contract_version: '1.0'
run_name: causal_dialoguegcn_iemocap_clean_roberta_v1_smoke_real_2epoch

system:
  seed: 42
  device: cuda

dataset:
  name: IEMOCAP
  feature_pkl_path: data/processed/iemocap/IEMOCAP_features_clean_roberta_base_c8b8a37_utterance_mean_v1.pkl
  feature_set_name: iemocap_clean_roberta_base_utterance_mean_v1
  feature_sha256: c604c557bc3fbb129ca02b2acd57166b669a89ef76ff0cea1e14f9cb206324bf
  num_classes: 6
  label_list: [Happy, Sad, Neutral, Angry, Excited, Frustrated]
  text_feature_dim: 768
  audio_feature_dim: 1582
  visual_feature_dim: 342
  valid_ratio: 0.1
  val_split_strategy: official_prefix
  sample_unit: dialogue

model:
  name: causal_dialoguegcn
  text_dim: 768
  audio_dim: 1582
  visual_dim: 342
  hidden_dim: 128
  context_hidden_dim: 128
  graph_hidden_dim: 128
  num_classes: 6
  dropout: 0.2
  fusion_type: concat
  context_encoder_type: causal_gru
  num_graph_layers: 1
  num_speakers: 2
  nodal_attention: none

graph:
  context_mode: causal
  window_past: 5
  window_future: 0

loss:
  class_weight_mode: none

training:
  epochs: 2
  batch_size: 8
  seed: 42
  select_best_by: val_weighted_f1
  grad_clip: 1.0
  num_workers: 0

optimizer:
  name: AdamW
  learning_rate: 0.0005
  weight_decay: 0.0001

scheduler:
  name: none

output:
  run_root: outputs/runs
