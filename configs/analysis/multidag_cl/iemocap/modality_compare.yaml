output:
  root: outputs
  experiment_date: null

analysis:
  name: multidag_cl_iemocap_modality_compare
  split: test

# Fill after formal from-scratch modality-ablation runs finish.
# Expected entries:
#   - modality_w5_t
#   - modality_w5_a
#   - modality_w5_v
#   - modality_w5_ta
#   - modality_w5_tv
#   - modality_w5_av
#   - modality_w5_tav
# Example:
# runs:
#   - run_id: 20260708_000000_iemocap_multidag_cl_modality_w5_t
#     display_name: modality_w5_t
runs: []

training_curves:
  metrics:
    - train_loss
    - val_loss
    - val_acc
    - val_uar
    - val_macro_f1
    - val_weighted_f1
  titles:
    train_loss: Training Loss
    val_loss: Validation Loss
    val_acc: Validation Accuracy
    val_uar: Validation UAR
    val_macro_f1: Validation Macro-F1
    val_weighted_f1: Validation Weighted-F1
  filenames:
    train_loss: modality_train_loss_comparison
    val_loss: modality_val_loss_comparison
    val_acc: modality_val_acc_comparison
    val_uar: modality_val_uar_comparison
    val_macro_f1: modality_val_macro_f1_comparison
    val_weighted_f1: modality_val_weighted_f1_comparison

overall:
  metrics:
    - acc
    - uar
    - macro_f1
    - weighted_f1
    - loss
  title: MultiDAGCL IEMOCAP Modality-Ablation Test Metrics
  filename: modality_overall_metrics_comparison

per_class:
  metrics:
    - recall
    - precision
    - f1
    - support
    - one_vs_rest_acc
  titles:
    recall: Per-class Recall
    precision: Per-class Precision
    f1: Per-class F1
    support: Per-class Support
    one_vs_rest_acc: Per-class One-vs-Rest Accuracy
  filenames:
    recall: modality_per_class_recall_comparison
    precision: modality_per_class_precision_comparison
    f1: modality_per_class_f1_comparison
    support: modality_per_class_support_comparison
    one_vs_rest_acc: modality_per_class_one_vs_rest_acc_comparison

ranking:
  primary_metric: weighted_f1
  secondary_metric: uar
  higher_is_better:
    loss: false
    acc: true
    uar: true
    macro_f1: true
    weighted_f1: true

figure:
  save_png: true
  save_pdf: true
  dpi: 300
