models:
  mmgcn:
    config: configs/baselines/mmgcn/iemocap/causal_benchmark/official_prefix.yaml
  multidag:
    config: configs/multidag_cl/unified/iemocap/causal_context/legacy_mmgcn_features/val_official_prefix.yaml
  gsmcc:
    config: configs/gsmcc/project_variant/iemocap/causal_context/legacy_mmgcn_features/val_official_prefix.yaml
  dialoguegcn:
    config: configs/dialoguegcn/unified/iemocap/causal_context/legacy_mmgcn_features/val_official_prefix.yaml

audit:
  mode: synthetic
  device: cpu
  seed: 2026
  batch_size: 2
  sequence_length: 5
  tolerance: 1.0e-6
  target_policy: auto_multiple
  gradient_target: history_squared_logit_sum
  perturbation_seeds: [42, 43, 44]

output:
  root: outputs
  experiment_date: null
  name: four_model_causal_audit_synthetic
