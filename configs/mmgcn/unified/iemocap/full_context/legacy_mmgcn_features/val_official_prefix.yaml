project:
  name: m3ed_mmgcn_clean
  experiment_name: mmgcn_iemocap_official_full_GCN4_noresidual

system:
  seed: 42
  device: cuda
  output_dir: outputs

dataset:
  name: IEMOCAP
  feature_pkl_path: third_party/MMGCN_official/IEMOCAP_features/IEMOCAP_features.pkl

  num_classes: 6
  label_list:
    - Happy
    - Sad
    - Neutral
    - Angry
    - Excited
    - Frustrated

  valid_ratio: 0.1
  val_split_strategy: official_prefix
  sample_unit: dialogue

model:
  name: MMGCN
  text_feature_dim: 100
  audio_feature_dim: 1582
  visual_feature_dim: 342
  hidden_dim: 256
  dropout: 0.5

train:
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_epochs: 30
  num_workers: 0

logging:
  save_best: true
  save_last: true
  monitor_metric: val_weighted_f1

graph:
  context_mode: full
  window_past: null
  window_future: null

  num_layers: 4
  lamda: 0.5
  alpha: 0.1
  gamma: 0.7

  use_speaker: true
  use_modal: true
  use_residual: false