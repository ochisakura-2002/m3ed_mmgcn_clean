analysis:
  name: multidag_cl_iemocap_context_compare
  output_dir: outputs/report_figures/multidag_cl/iemocap/context_compare
  split: test

# Fill after formal context-window runs finish.
# Expected entries:
#   - context_w0_tav
#   - context_w1_tav
#   - context_w3_tav
#   - context_w5_tav
#   - context_past_all_causal_tav
# Example:
# runs:
#   - run_id: 20260708_000000_iemocap_multidag_cl_context_w5_tav
#     display_name: context_w5_tav
runs: []

training_curves:
  metrics:
    - train_loss
    - val_loss
    - val_acc
    - val_uar
    - val_macro_f1
    - val_weighted_f1
  titles:
    train_loss: Training Loss
    val_loss: Validation Loss
    val_acc: Validation Accuracy
    val_uar: Validation UAR
    val_macro_f1: Validation Macro-F1
    val_weighted_f1: Validation Weighted-F1
  filenames:
    train_loss: context_train_loss_comparison
    val_loss: context_val_loss_comparison
    val_acc: context_val_acc_comparison
    val_uar: context_val_uar_comparison
    val_macro_f1: context_val_macro_f1_comparison
    val_weighted_f1: context_val_weighted_f1_comparison

overall:
  metrics:
    - acc
    - uar
    - macro_f1
    - weighted_f1
    - loss
  title: MultiDAGCL IEMOCAP Context-Window Test Metrics
  filename: context_overall_metrics_comparison

per_class:
  metrics:
    - recall
    - precision
    - f1
    - support
    - one_vs_rest_acc
  titles:
    recall: Per-class Recall
    precision: Per-class Precision
    f1: Per-class F1
    support: Per-class Support
    one_vs_rest_acc: Per-class One-vs-Rest Accuracy
  filenames:
    recall: context_per_class_recall_comparison
    precision: context_per_class_precision_comparison
    f1: context_per_class_f1_comparison
    support: context_per_class_support_comparison
    one_vs_rest_acc: context_per_class_one_vs_rest_acc_comparison

ranking:
  primary_metric: weighted_f1
  secondary_metric: uar
  higher_is_better:
    loss: false
    acc: true
    uar: true
    macro_f1: true
    weighted_f1: true

figure:
  save_png: true
  save_pdf: true
  dpi: 300
