project:
  pipeline_name: multidag_cl_iemocap_w5_missing_modalities

dataset:
  name: IEMOCAP

model:
  name: MultiDAGCL

train:
  enabled: false
  train_config_path: configs/baselines/multidag_cl/iemocap_multidag_cl_causal_w5.yaml

evaluation:
  enabled: false
  splits: [test]
  checkpoint_name: best_model.pt

analysis_tables:
  enabled: false

single_run_analysis:
  enabled: false
  training_curves: false
  final_analysis: false

multi_run_training_curves:
  enabled: false
  config_path: configs/analysis/multidag_cl_iemocap_context_compare.yaml

multi_run_final_analysis:
  enabled: false
  config_path: configs/analysis/multidag_cl_iemocap_context_compare.yaml

run_control:
  # Fill this with the trained causal_w5 TAV run_id before running.
  skip_train_use_run_id: ""

execution:
  dry_run: false

missing_modalities:
  enabled: true
  checkpoint_name: best_model.pt
  split: test
  settings: ["TAV", "TA", "TV", "AV", "T", "A", "V"]
  output_subdir: missing_modalities
  make_figures: true
  skip_if_not_full_train_modalities: true
