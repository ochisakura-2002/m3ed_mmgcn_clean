project:
  pipeline_name: multidag_cl_iemocap_context_past_all

dataset:
  name: IEMOCAP

model:
  name: MultiDAGCL

train:
  enabled: true
  train_config_path: configs/baselines/multidag_cl/iemocap_multidag_cl_past_all_causal.yaml

evaluation:
  enabled: true
  splits: [val, test]
  checkpoint_name: best_model.pt

analysis_tables:
  enabled: true

single_run_analysis:
  enabled: true
  training_curves: true
  final_analysis: true

multi_run_training_curves:
  enabled: false
  config_path: configs/analysis/multidag_cl_iemocap_context_compare.yaml

multi_run_final_analysis:
  enabled: false
  config_path: configs/analysis/multidag_cl_iemocap_context_compare.yaml

run_control:
  skip_train_use_run_id: ""

execution:
  dry_run: false

missing_modalities:
  enabled: false
