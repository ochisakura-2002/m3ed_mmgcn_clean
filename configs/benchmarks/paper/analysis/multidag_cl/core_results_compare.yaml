output:
  root: outputs
  experiment_date: null

analysis:
  name: multidag_cl_iemocap_core_results_compare
  split: test

# Fill after the core formal runs finish.
# Recommended entries:
#   - context_w5_tav
#   - context_past_all_causal_tav
#   - context_w0_tav
#
# The existing multi-run final-analysis script compares normal evaluation
# metrics from the discovered dated (or legacy) evaluation_master.csv. It does not
# consume missing-modality summary.csv directly. Use the missing-modality
# pipeline's own summary figure for missing-modality results.
runs: []

training_curves:
  metrics:
    - train_loss
    - val_loss
    - val_acc
    - val_uar
    - val_macro_f1
    - val_weighted_f1
  titles:
    train_loss: Training Loss
    val_loss: Validation Loss
    val_acc: Validation Accuracy
    val_uar: Validation UAR
    val_macro_f1: Validation Macro-F1
    val_weighted_f1: Validation Weighted-F1
  filenames:
    train_loss: core_train_loss_comparison
    val_loss: core_val_loss_comparison
    val_acc: core_val_acc_comparison
    val_uar: core_val_uar_comparison
    val_macro_f1: core_val_macro_f1_comparison
    val_weighted_f1: core_val_weighted_f1_comparison

overall:
  metrics:
    - acc
    - uar
    - macro_f1
    - weighted_f1
    - loss
  title: MultiDAGCL IEMOCAP Core Test Metrics
  filename: core_overall_metrics_comparison

per_class:
  metrics:
    - recall
    - precision
    - f1
    - support
    - one_vs_rest_acc
  titles:
    recall: Per-class Recall
    precision: Per-class Precision
    f1: Per-class F1
    support: Per-class Support
    one_vs_rest_acc: Per-class One-vs-Rest Accuracy
  filenames:
    recall: core_per_class_recall_comparison
    precision: core_per_class_precision_comparison
    f1: core_per_class_f1_comparison
    support: core_per_class_support_comparison
    one_vs_rest_acc: core_per_class_one_vs_rest_acc_comparison

ranking:
  primary_metric: weighted_f1
  secondary_metric: uar
  higher_is_better:
    loss: false
    acc: true
    uar: true
    macro_f1: true
    weighted_f1: true

figure:
  save_png: true
  save_pdf: true
  dpi: 300
