schema_version: '1.0'
causal: true
causal_contract_version: '1.0'
run_name: long_training_gsmcc_project_variant_causal_context_base

long_training:
  model_family: gsmcc_project_variant
  display_name: GS-MCC Project Variant
  protocol_lineage: unified_clean
  implementation_lineage: project_variant
  context_mode: causal_context
  entrypoint: scripts/workflows/causal_graph/train.py
  parameter_source: configs/gsmcc/project_variant/iemocap/causal_context/legacy_mmgcn_features/val_ses01.yaml
  clean_feature_source: configs/gsmcc/project_variant/iemocap/causal_context/clean_roberta_features/smoke_real_2epoch.yaml

system:
  seed: 42
  device: cuda

dataset:
  name: IEMOCAP
  feature_pkl_path: data/processed/iemocap/IEMOCAP_features_clean_roberta_base_c8b8a37_utterance_mean_v1.pkl
  feature_set_name: iemocap_clean_roberta_base_utterance_mean_v1
  feature_sha256: c604c557bc3fbb129ca02b2acd57166b669a89ef76ff0cea1e14f9cb206324bf
  num_classes: 6
  label_list: [Happy, Sad, Neutral, Angry, Excited, Frustrated]
  text_feature_dim: 768
  audio_feature_dim: 1582
  visual_feature_dim: 342
  valid_ratio: 0.1
  val_split_strategy: session_holdout
  val_session_id: Ses01
  test_session_id: Ses05
  sample_unit: dialogue

model:
  name: causal_gsmcc_inspired
  text_dim: 768
  audio_dim: 1582
  visual_dim: 342
  hidden_dim: 128
  num_classes: 6
  dropout: 0.2
  modality_encoder_type: linear
  fusion_type: concat
  num_graph_layers: 1
  num_filter_steps: 2

graph:
  context_mode: causal
  window_past: 5
  window_future: 0

loss:
  classification_weight: 1.0
  consistency_weight: 0.0
  complementarity_weight: 0.0

training:
  epochs: 30
  batch_size: 8
  seed: 42
  select_best_by: val_weighted_f1
  grad_clip: 1.0
  num_workers: 0

optimizer:
  name: AdamW
  learning_rate: 0.0005
  weight_decay: 0.0001

scheduler:
  name: none

output:
  root: outputs
  experiment_date: null

protocol:
  run_type: formal_long_training_candidate
  checkpoint_selection_metric: val_weighted_f1
  checkpoint_selection_split: validation
  test_split_used_for_selection: false
  future_context_allowed: false

provenance:
  parameter_source: configs/gsmcc/project_variant/iemocap/causal_context/legacy_mmgcn_features/val_ses01.yaml
  clean_feature_source: configs/gsmcc/project_variant/iemocap/causal_context/clean_roberta_features/smoke_real_2epoch.yaml
  feature_registry_key: clean_roberta_v1
  implementation_status: PROJECT_VARIANT_NOT_PAPER_REPRODUCTION
  clean_adaptation: feature_declaration_and_text_dimensions_only
  numerical_safety_source: zero_auxiliary_loss_weights_and_causal_runtime_contract

