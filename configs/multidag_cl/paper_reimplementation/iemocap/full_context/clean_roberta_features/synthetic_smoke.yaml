schema_version: '1.0'
run_name: mdcl_pr_syn_smoke
registry_key: multidag_cl_paper_reimplementation
experiment: {context_label: full_context}
model_core:
  identity: {canonical_name: multidag_cl_paper_reimplementation, display_name: MultiDAG-CL Paper Reimplementation, implementation_identity: paper_reimplementation, conformance_profile: paper_formula_behavior}
  data: {track: project_fair, text_feature_dim: 8, audio_feature_dim: 6, visual_feature_dim: 5, num_classes: 3}
  encoder:
    profile: paper_modality_specific
    modality_order: [audio, visual, text]
    modality_output_dims: {audio: 100, visual: 100, text: 100}
    text_sequence_axis: dialogue_utterance
    text_bidirectional: true
    causal_text_ablation: false
    single_projection: false
  graph: {predecessor_profile: official_same_speaker_count_window, window_past_same_speaker: 1, window_future: 0, allow_self_edge: false, allow_future_edge: false, global_nodal_attention: false}
  attention: {score: concat_linear, relation_on_values: true, dropout: 0.0}
  dag: {hidden_dim: 300, layers: 1, dual_gru: swapped_input_hidden_sum, layer_parameter_sharing: false, representation: encoder_plus_all_dag_layers, raw_feature_skip: false}
  classifier: {hidden_dim: 300, hidden_layers: 2, activation: relu, dropout: 0.4}
  curriculum: {enabled: true, bucket_count: 5, partition: balanced_stable_contiguous, schedule: official_one_bucket_per_epoch}
  training:
    epochs: 30
    batch_size: 16
    seed: 100
    optimizer: {name: adamw_transformers_3_5_1_compatible, learning_rate: 0.0005, betas: [0.9, 0.999], eps: 0.000001, weight_decay: 0.0, bias_correction: true, parameter_grouping: all_parameters_single_group}
    gradient_clip_norm: 5.0
    scheduler: none
    amp: false
    early_stopping: false
  loss: {name: cross_entropy, class_weight: null, label_smoothing: 0.0, ignore_index: -100}
  checkpoint: {test_split_used_for_selection: false}
dataset:
  name: SYNTHETIC
  feature_registry: synthetic_v1
  feature_path: synthetic://multidag-cl-stage-b3-v1
  feature_sha256: 621271096b4ca47b3e61efd51ad28bc728fbcdc3264badc367cec90546709406
  feature_dimensions: {text: 8, audio: 6, visual: 5}
  split_protocol: synthetic_stage_b3_controlled
  protocol_comparability: smoke_only_not_reproduction
  val_split_strategy: synthetic_fixed
  validation_session: synthetic_val
  test_session: synthetic_fake_test
  label_names: [class_0, class_1, class_2]
  speaker_mapping: equality_preserving_synthetic_ids
