schema_version: '1.0'
run_name: long_training_dialoguegcn_full_context_base
profile: formal_long_training_base

long_training:
  model_family: dialoguegcn
  display_name: DialogueGCN
  protocol_lineage: unified_clean
  implementation_lineage: paper_aligned
  context_mode: full_context
  entrypoint: scripts/workflows/paper_aligned/train.py
  parameter_source: configs/dialoguegcn/paper_aligned/iemocap/full_context/clean_roberta_features/dialoguegcn_clean.yaml

model:
  name: original_repro_dialoguegcn
  causal_grade: noncausal_offline_full_context
  text_feature_dim: 768
  audio_feature_dim: 1582
  visual_feature_dim: 342
  num_classes: 6
  context_hidden_dim: 100
  graph_hidden_dim: 100
  num_speakers: 2
  dropout: 0.4
  use_nodal_attention: true
  use_class_weight: true
  base_model: LSTM
  window_past: 10
  window_future: 10
  active_modalities: [text]

dataset:
  name: IEMOCAP
  feature_set_name: iemocap_clean_roberta_base_utterance_mean_v1
  feature_protocol: clean_roberta_v1
  feature_cleanliness: frozen_self_supervised_utterance_only
  usage: fair_main_experiment
  experiment_track: clean_roberta_fivefold_fair_comparison
  protocol_comparability: fair_comparison_not_paper_reproduction
  feature_pkl_path: data/processed/iemocap/IEMOCAP_features_clean_roberta_base_c8b8a37_utterance_mean_v1.pkl
  feature_sha256: c604c557bc3fbb129ca02b2acd57166b669a89ef76ff0cea1e14f9cb206324bf
  num_classes: 6
  label_list: [Happy, Sad, Neutral, Angry, Excited, Frustrated]
  val_split_strategy: outer_session_stratified
  outer_test_session: Ses05
  inner_val_ratio: 0.1
  split_seed: 42

training:
  epochs: 60
  batch_size: 32
  seed: 42
  select_best_by: val_weighted_f1
  grad_clip: 1.0
  num_workers: 0
  early_stopping_patience: 10
  amp: false

optimizer:
  name: Adam
  learning_rate: 0.0003
  weight_decay: 0.0

scheduler:
  name: none

system:
  seed: 42
  device: cuda

output:
  root: outputs
  experiment_date: null

protocol:
  run_type: formal_long_training_candidate
  checkpoint_selection_metric: val_weighted_f1
  checkpoint_selection_split: validation
  test_split_used_for_selection: false
  future_context_allowed: true

provenance:
  parameter_source: configs/dialoguegcn/paper_aligned/iemocap/full_context/clean_roberta_features/dialoguegcn_clean.yaml
  formal_batch_reference: causal8_original8_formal_20260722_012904
  feature_registry_key: clean_roberta_v1
  implementation_status: paper_aligned_not_author_official

