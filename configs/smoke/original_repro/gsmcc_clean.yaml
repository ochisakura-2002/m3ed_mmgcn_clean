run_name: original_gsmcc_clean_smoke
profile: smoke
protocol_version: original_merc_three_track_v2
model:
  name: project_paper_oriented_gsmcc
  fidelity_status: PROJECT_VARIANT_NOT_PAPER_REPRODUCTION
  causal_grade: noncausal_offline_full_context
  text_feature_dim: 768
  audio_feature_dim: 1582
  visual_feature_dim: 342
  num_classes: 6
  hidden_dim: 100
  num_speakers: 2
  graph_layers: 4
  window: 10
  dropout: 0.4
  cross_modal_scale: 1.0
  use_contrastive_loss: true
  contrastive_temperature: 0.1
