causal: true
causal_contract_version: '1.0'

project:
  name: m3ed_mmgcn_clean
  experiment_name: mmgcn_iemocap_clean_roberta_v1_val_ses03

system:
  seed: 42
  device: cuda
  output_dir: outputs

dataset:
  name: IEMOCAP
  feature_pkl_path: data/processed/iemocap/IEMOCAP_features_clean_roberta_base_c8b8a37_utterance_mean_v1.pkl
  feature_set_name: iemocap_clean_roberta_base_utterance_mean_v1
  feature_sha256: c604c557bc3fbb129ca02b2acd57166b669a89ef76ff0cea1e14f9cb206324bf
  num_classes: 6
  label_list: [Happy, Sad, Neutral, Angry, Excited, Frustrated]
  valid_ratio: 0.1
  val_split_strategy: session_holdout
  val_session_id: Ses03
  test_session_id: Ses05
  sample_unit: dialogue

model:
  name: MMGCN
  text_feature_dim: 768
  audio_feature_dim: 1582
  visual_feature_dim: 342
  hidden_dim: 256
  dropout: 0.5

train:
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_epochs: 30
  num_workers: 0

logging:
  save_best: true
  save_last: true
  monitor_metric: val_weighted_f1

graph:
  context_mode: causal
  window_past: null
  window_future: 0
  num_layers: 4
  lamda: 0.5
  alpha: 0.1
  gamma: 0.7
  use_speaker: true
  use_modal: true
  use_residual: false

protocol:
  run_type: formal
  checkpoint_selection_metric: val_weighted_f1
  test_split_used_for_selection: false
  future_context_allowed: false

provenance:
  source_config: configs/baselines/mmgcn/iemocap/causal_benchmark/val_ses03.yaml
  feature_registry_key: clean_roberta_v1
  feature_set_name: iemocap_clean_roberta_base_utterance_mean_v1
  feature_sha256: c604c557bc3fbb129ca02b2acd57166b669a89ef76ff0cea1e14f9cb206324bf
