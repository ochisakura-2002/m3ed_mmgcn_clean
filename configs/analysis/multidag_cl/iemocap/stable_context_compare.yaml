analysis:
  name: multidag_cl_iemocap_stable_context_compare
  output_dir: outputs/report_figures/multidag_cl/iemocap/stable_context_compare
  split: test

# Fill after stable-candidate context runs finish.
# Expected entries:
#   - stable_w0
#   - stable_w3
#   - stable_w5
#   - stable_past_all_causal
# Example:
# runs:
#   - run_id: 20260709_000000_iemocap_multidag_cl_context_w5_tav_stable_candidate
#     display_name: stable_w5
runs: []

training_curves:
  metrics:
    - train_loss
    - val_loss
    - val_acc
    - val_uar
    - val_macro_f1
    - val_weighted_f1
  titles:
    train_loss: Stable Candidate Training Loss
    val_loss: Stable Candidate Validation Loss
    val_acc: Stable Candidate Validation Accuracy
    val_uar: Stable Candidate Validation UAR
    val_macro_f1: Stable Candidate Validation Macro-F1
    val_weighted_f1: Stable Candidate Validation Weighted-F1
  filenames:
    train_loss: stable_context_train_loss_comparison
    val_loss: stable_context_val_loss_comparison
    val_acc: stable_context_val_acc_comparison
    val_uar: stable_context_val_uar_comparison
    val_macro_f1: stable_context_val_macro_f1_comparison
    val_weighted_f1: stable_context_val_weighted_f1_comparison

overall:
  metrics:
    - acc
    - uar
    - macro_f1
    - weighted_f1
    - loss
  title: MultiDAGCL IEMOCAP Stable-Candidate Context Test Metrics
  filename: stable_context_overall_metrics_comparison

per_class:
  metrics:
    - recall
    - precision
    - f1
    - support
    - one_vs_rest_acc
  titles:
    recall: Stable Candidate Per-class Recall
    precision: Stable Candidate Per-class Precision
    f1: Stable Candidate Per-class F1
    support: Stable Candidate Per-class Support
    one_vs_rest_acc: Stable Candidate Per-class One-vs-Rest Accuracy
  filenames:
    recall: stable_context_per_class_recall_comparison
    precision: stable_context_per_class_precision_comparison
    f1: stable_context_per_class_f1_comparison
    support: stable_context_per_class_support_comparison
    one_vs_rest_acc: stable_context_per_class_one_vs_rest_acc_comparison

ranking:
  primary_metric: weighted_f1
  secondary_metric: uar
  higher_is_better:
    loss: false
    acc: true
    uar: true
    macro_f1: true
    weighted_f1: true

figure:
  save_png: true
  save_pdf: true
  dpi: 300
