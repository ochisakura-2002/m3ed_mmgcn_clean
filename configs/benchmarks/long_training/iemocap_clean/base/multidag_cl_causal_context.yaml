schema_version: '1.0'
protocol_version: long_training_session_holdout_v1
causal: true
causal_contract_version: '1.0'

long_training:
  model_family: multidag_cl
  display_name: MultiDAG-inspired + CL
  protocol_lineage: unified_clean
  implementation_lineage: unified
  context_mode: causal_context
  entrypoint: scripts/models/multidag_cl/unified/train.py
  parameter_source: configs/multidag_cl/unified/iemocap/causal_context/clean_roberta_features/val_ses01.yaml

project:
  name: m3ed_mmgcn_clean
  experiment_name: long_training_multidag_cl_causal_context_base

system:
  seed: 42
  device: cuda
  output_dir: outputs

dataset:
  name: IEMOCAP
  feature_pkl_path: data/processed/iemocap/IEMOCAP_features_clean_roberta_base_c8b8a37_utterance_mean_v1.pkl
  feature_set_name: iemocap_clean_roberta_base_utterance_mean_v1
  feature_sha256: c604c557bc3fbb129ca02b2acd57166b669a89ef76ff0cea1e14f9cb206324bf
  experiment_track: clean_roberta_session_holdout_fair_comparison
  protocol_comparability: fair_comparison_not_paper_reproduction
  num_classes: 6
  label_list: [Happy, Sad, Neutral, Angry, Excited, Frustrated]
  valid_ratio: 0.1
  val_split_strategy: session_holdout
  val_session_id: Ses01
  test_session_id: Ses05
  sample_unit: dialogue

model:
  name: MultiDAGCL
  text_feature_dim: 768
  audio_feature_dim: 1582
  visual_feature_dim: 342
  hidden_dim: 128
  num_classes: 6
  num_speakers: 2
  dropout: 0.2
  active_modalities: [text, audio, visual]
  num_graph_layers: 1
  modality_encoder_type: causal_gru
  modality_encoder_layers: 1

graph:
  context_mode: causal
  window_past: 5
  window_future: 0

training:
  epochs: 30
  batch_size: 8
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  select_best_by: val_weighted_f1
  num_workers: 0

output:
  root: outputs
  experiment_date: null
  experiment_name: long_training_multidag_cl_causal_context_base

protocol:
  run_type: formal_long_training_candidate
  checkpoint_selection_metric: val_weighted_f1
  checkpoint_selection_split: validation
  test_split_used_for_selection: false
  future_context_allowed: false

provenance:
  parameter_source: configs/multidag_cl/unified/iemocap/causal_context/clean_roberta_features/val_ses01.yaml
  feature_registry_key: clean_roberta_v1
  feature_set_name: iemocap_clean_roberta_base_utterance_mean_v1
  feature_sha256: c604c557bc3fbb129ca02b2acd57166b669a89ef76ff0cea1e14f9cb206324bf
  implementation_status: unified_not_author_official
