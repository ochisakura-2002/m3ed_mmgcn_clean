causal: true
causal_contract_version: '1.0'
run_name: causal_gsmcc_iemocap_val_ses04

system:
  seed: 42
  device: cuda

dataset:
  name: IEMOCAP
  feature_pkl_path: third_party/MMGCN_official/IEMOCAP_features/IEMOCAP_features.pkl
  feature_sha256: ceb5cc9a45d1792998438e27f86a12642320aa6315546e4425316140ea503fb3
  num_classes: 6
  label_list: [Happy, Sad, Neutral, Angry, Excited, Frustrated]
  text_feature_dim: 100
  audio_feature_dim: 1582
  visual_feature_dim: 342
  valid_ratio: 0.1
  val_split_strategy: session_holdout
  val_session_id: Ses04
  sample_unit: dialogue

model:
  name: causal_gsmcc_inspired
  text_dim: 100
  audio_dim: 1582
  visual_dim: 342
  hidden_dim: 128
  num_classes: 6
  dropout: 0.2
  modality_encoder_type: linear
  fusion_type: concat
  num_graph_layers: 1
  num_filter_steps: 2

graph:
  context_mode: causal
  window_past: 5
  window_future: 0

loss:
  classification_weight: 1.0
  consistency_weight: 0.0
  complementarity_weight: 0.0

training:
  epochs: 30
  batch_size: 8
  seed: 42
  select_best_by: val_weighted_f1
  grad_clip: 1.0
  num_workers: 0

optimizer:
  name: AdamW
  learning_rate: 0.0005
  weight_decay: 0.0001

scheduler:
  name: none

output:
  run_root: outputs/runs

