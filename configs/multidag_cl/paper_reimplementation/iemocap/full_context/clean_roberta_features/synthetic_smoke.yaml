  split_sizes: {train: 5, val: 3, test: 2}
  sequence_length: 3
runtime:
  mode: synthetic-smoke
  formal_experiment: false
  smoke_only: true
  epochs: 1
  batch_size: 2
  seed: 100
  num_workers: 0
  device: cpu
  smoke_output_root: tmp/assistant_work/paper_reproduction_stage_b3_runtime_correction/smoke_outputs
  optimizer: {name: AdamW, learning_rate: 0.0005, betas: [0.9, 0.999], eps: 0.000001, weight_decay: 0.0, amsgrad: false, maximize: false, foreach: false, capturable: false, differentiable: false, fused: null, parameter_grouping: all_parameters_single_group, bias_correction: native AdamW standard bias correction}
  scheduler: none
  gradient_clipping: {mode: global_norm, max_norm: 5.0, norm_type: 2.0, error_if_nonfinite: true}
  class_weight: null
  label_smoothing: 0.0
  early_stopping: false
  limits: {epochs: 1, optimizer_steps: 1, train_batches: 1, validation_batches: 2, test_batches: 1, real_test_batches: 0}
checkpoint: {primary_metric: val_weighted_f1, secondary_tiebreak: val_loss_lower, tertiary_tiebreak: earlier_epoch, test_split_used_for_selection: false, test_evaluation_count: 1}
output:
